# EdgeDrive Perception Configuration
# Default configuration for the perception pipeline.
# Override with environment variables: EDGEDRIVE_DEVICE, EDGEDRIVE_LOG_LEVEL

pipeline:
  enable_tracking: true
  enable_events: true
  latency_threshold_ms: 100.0
  max_frame_count: null  # null = process all frames

  detector:
    model_name: fasterrcnn_mobilenet_v3_large_320_fpn
    model_version: "v1.0.0"
    pretrained: true
    num_classes: 91
    input_resolution: [320, 320]
    confidence_threshold: 0.5
    nms_threshold: 0.5
    device: cpu  # cpu or cuda (auto-falls-back to cpu)
    min_detection_area: 100.0

  tracker:
    iou_threshold: 0.3
    max_age: 30
    min_hits: 3
    min_confidence: 0.3

benchmark:
  warmup_iterations: 5
  timed_iterations: 50
  batch_size: 1
  input_resolution: [320, 320]
  output_dir: outputs/benchmark
  export_onnx: false

log_level: INFO
log_json: false